# Same safety-net pattern as the sibling gyftr-portal frontend CI: build with
# placeholder Cognito config, then verify (1) it actually landed in the built
# JS — catches "build succeeds but Cognito env didn't get baked in, so every
# login silently fails on a blank/broken screen" — and (2) nothing that looks
# like a real secret ended up in dist/.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc -b
      - name: Build with placeholder Cognito config
        env:
          VITE_API_URL: https://ci-placeholder.invalid
          VITE_COGNITO_USER_POOL_ID: ci-placeholder-pool-id
          VITE_COGNITO_CLIENT_ID: ci-placeholder-client-id
        run: npm run build
      - name: Verify Cognito config actually landed in dist/
        run: |
          if ! grep -rq "ci-placeholder-pool-id" dist/; then
            echo "VITE_COGNITO_USER_POOL_ID did not make it into the build output — login would be broken in production."
            exit 1
          fi
      - name: Scan dist/ for anything that looks like a real secret
        run: |
          if grep -rEq "sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|sbp_[A-Za-z0-9]{20,}|-----BEGIN" dist/; then
            echo "Something that looks like a real secret ended up in the built output."
            grep -rEn "sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|sbp_[A-Za-z0-9]{20,}|-----BEGIN" dist/
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev
      - name: Syntax-check every backend file
        run: |
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f" || exit 1
          done
